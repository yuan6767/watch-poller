name: watch-poller

on:
  schedule:
    # 每 5 分钟一次（GitHub 免费公开仓库的最低间隔；高峰期可能延迟或跳过）
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: watch-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 连 IM 拉未读并用 AI 回复
        env:
          IM_CONFIG_JSON: ${{ secrets.IM_CONFIG_JSON }}
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          HOST_HB_URL: ${{ secrets.HOST_HB_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node poller.js

      - name: 保存同步进度 syncKey
        run: |
          if [ -f state.json ]; then
            git config user.name "watch-poller"
            git config user.email "poller@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "sync state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || echo "push skipped"
          fi
