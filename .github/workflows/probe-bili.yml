name: probe-bili
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 探测 B站 / 网易云
        run: node scripts/probe-bili4.js
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
